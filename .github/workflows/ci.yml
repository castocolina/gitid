---
# gitid CI — SHA-pinned, least-privilege, cost-tiered gate (BUILD-01, BUILD-02, BUILD-04).
#
# Design (see .planning/phases/01-foundations-spikes-ci/01-07-PLAN.md):
#   - `build-cross` runs ONCE on ubuntu-latest. Cross-compilation via GOOS/GOARCH is
#     OS-independent (no cgo in this module), so running it redundantly on every matrix
#     runner would waste CI minutes for zero additional signal.
#   - `check` is the fast PR gate: `make setup-env` (reproduces the dev toolchain from a
#     fresh clone, BUILD-04) -> `make test` (-race) -> `make lint` (golangci-lint + gosec)
#     runs on ALL THREE corrected runners (ubuntu-latest, macos-15-intel, macos-15) on
#     every pull_request and every push to main. The earlier (now-stale) Intel/ARM macOS
#     runner labels from CONTEXT.md's original D-12 are deliberately NOT used — see
#     01-RESEARCH.md "State of the Art" for the deprecation timeline that motivated the
#     correction to the macos-15 labels used here.
#   - `test-e2e` is a separate job (split out of `check` at v0.1.0-rc.6) sharded 4-way
#     per OS via scripts/e2e-shard.sh, cost-tiered per CONTEXT.md D-13's documented
#     lever: ubuntu-latest and macos-15 shard on every event (PR and push), macos-15-
#     intel shards only on push to main. The split itself (not just the tiering) is a
#     deliberate mitigation: v0.1.0-rc.1 through rc.6 all failed a single long-running,
#     single-process `make test-e2e` on GitHub Actions' shared runners with a shifting
#     set of failures that never reproduced locally — see the job's own comment.
#   - Every `uses:` step is pinned to a full 40-character commit SHA (tags are mutable)
#     with a trailing `# vX.Y.Z` comment for human readability.
#   - Least-privilege top-level `permissions: contents: read`. No repository secret is
#     referenced anywhere: the `release:` job publishes with the automatically
#     provided job token under a job-scoped `contents: write` grant (D-05).
#
# CI invokes the SAME make targets a human runs locally (single source of truth) — no
# raw go/golangci-lint commands are inlined here.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26.x"

jobs:
  # Cross-compile the full release build matrix once, on Linux. GOOS/GOARCH
  # cross-compilation does not require the target OS to be present on the runner.
  build-cross:
    name: build-cross (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: make build-cross
        run: make build-cross

  # Fast PR gate: reproduce the toolchain from a fresh clone, then run the race-enabled
  # test suite and lint on all three corrected runners. The heavier test-e2e step is
  # cost-tiered per D-13 (see header comment and the step's own `if:` condition).
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-15]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # setup-go's built-in cache (module cache + build cache, keyed by go.sum)
          # avoids a redundant actions/cache dependency for this project's needs.
          cache: true

      - name: make setup-env (reproduce dev toolchain from a fresh clone)
        run: make setup-env

      - name: make test (-race)
        run: make test

      - name: make lint (golangci-lint + gosec)
        run: make lint

  # test-e2e: split out of `check` into its own job, sharded 4-way per OS
  # (BUILD-03/BUILD-05 recovery, v0.1.0-rc.6). v0.1.0-rc.1 through rc.6 all
  # failed a single ~950s -race test-e2e process on GitHub Actions with a
  # shifting set of failures that never reproduced locally (even under a
  # matched core count) after every per-assertion timing cause found along
  # the way was fixed — most consistent with cumulative resource
  # contention building up over one long single-process run on a shared
  # runner. Four shorter, parallel shards reduce both per-job wall time and
  # that cumulative pressure. See scripts/e2e-shard.sh and the Makefile's
  # test-e2e-shard target.
  #
  # Cost-tiered per D-13, same as before: ubuntu-latest + macos-15 shard on
  # every event (PR and push); macos-15-intel shards only on push to main.
  test-e2e:
    name: test-e2e (${{ matrix.os }}, shard ${{ matrix.shard }}/4)
    runs-on: ${{ matrix.os }}
    if: ${{ github.event_name == 'push' || matrix.os != 'macos-15-intel' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-15]
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: make setup-env (reproduce dev toolchain from a fresh clone)
        run: make setup-env

      # TMPDIR=/tmp: macOS runners default TMPDIR to a long per-process
      # /var/folders/<hash>/T/ path; t.TempDir() (and every fake-binary
      # helper built on it, e.g. FakeGHDir/FakeSSHDir) honors $TMPDIR, and
      # a PTY frame later rendering one of those paths can hard-wrap it
      # across lines on CI in a way that never happens against a local
      # dev machine's shorter TMPDIR (v0.1.0-rc.4's
      # TestIdentityManager_KeyCeremonyRotate/Repair failures). No-op on
      # ubuntu-latest, whose default TMPDIR is already /tmp.
      - name: make test-e2e-shard
        env:
          TMPDIR: /tmp
          E2E_SHARD: ${{ matrix.shard }}
          E2E_SHARDS: 4
        run: make test-e2e-shard

  # BUILD-03: publish stamped binaries + checksums.txt on a v* tag.
  # This is the only job in this workflow carrying write permission, and the
  # grant is job-scoped (D-05). needs: exists so a red gate on the tagged
  # commit cannot publish a public binary (this phase's resolution of
  # 09.3-RESEARCH.md Open Question 1, which CONTEXT.md left open). The job
  # builds its own stamped binaries rather than consuming another job's
  # outputs, because build-cross's routine artifacts are unstamped and are
  # produced on a different event (09.3-RESEARCH.md Pitfall 1).
  release:
    name: release (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: [check, build-cross, test-e2e]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Compute release version metadata
        id: relver
        run: |
          # The release's visibility is decided by the create call, so any
          # repair applied later means the release was publicly wrong for the
          # window in between — a prerelease briefly presented as the
          # repository's latest stable download is exactly the failure a
          # checksum-verifying installer cannot protect anyone from. Because
          # the classifier reads the tag, the developer's choice at plan
          # 09.3-02's checkpoint is expressed in the tag string itself:
          # choosing a prerelease MEANS choosing a tag with a suffix.
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          case "${GITHUB_REF_NAME}" in
            *-*)
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              echo "make_latest=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              echo "make_latest=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: make checksums (stamped cross-build + SHA-256 manifest)
        run: |
          make checksums \
            VERSION=${{ steps.relver.outputs.version }} \
            COMMIT=${{ steps.relver.outputs.commit }} \
            DATE=${{ steps.relver.outputs.date }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ steps.relver.outputs.prerelease }}
          make_latest: ${{ steps.relver.outputs.make_latest }}
          files: |
            bin/gitid-darwin-amd64
            bin/gitid-darwin-arm64
            bin/gitid-linux-amd64
            bin/gitid-linux-arm64
            bin/checksums.txt
